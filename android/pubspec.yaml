# Reconstructed from imports, APK version metadata and embedded package paths.
# The original pubspec.yaml and lockfile were not present in the APK.
name: videodownloader
description: TurboSave local Android downloader with share-to-app review.
publish_to: none
version: 1.5.3+13

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: 11.0.0
  http: 1.6.0
  provider: 6.1.5+1
  shared_preferences: 2.5.6
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/fonts/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
